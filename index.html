<meta charset="UTF-8">
<title>달맞이 들판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen game card. HUD strip, tile-map canvas, action bar; dialogs float over everything. Deliberately single dark "evening field" theme. */
:root{
  --night:#14232a; --panel:#1d3137; --panel2:#274047; --line:#3d5d63;
  --text:#eef3e6; --muted:#a9bfb3; --lantern:#f2c14e; --moss:#8fc46a; --rose:#ec8b8b; --sky:#7cc7e8;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--night);color:var(--text);font-family:var(--f-body);font-size:15px;padding-inline:16px;padding-block:14px;box-sizing:border-box}
.game{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.brand{font-family:var(--f-display);font-size:24px;color:var(--lantern);letter-spacing:.02em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);letter-spacing:.08em;margin-top:4px}
.stats{display:flex;gap:6px 14px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.stat b{color:var(--text);font-weight:normal;font-family:var(--f-display);font-size:16px;letter-spacing:0}
.meter{width:64px;height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--moss);transition:width .25s}
.meter.hp i{background:var(--rose)}
.stage{position:relative;border-radius:10px;overflow:hidden;border:2px solid var(--line);background:#0c1518}
#cv{display:block;width:100%;height:auto;aspect-ratio:16/9;touch-action:none}
.place{position:absolute;left:10px;top:8px;font-family:var(--f-display);font-size:14px;background:rgba(15,26,30,.78);padding:3px 10px;border-radius:6px;pointer-events:none}
.hint{position:absolute;left:10px;bottom:8px;font-size:13px;background:rgba(15,26,30,.85);padding:4px 10px;border-radius:6px;pointer-events:none;max-width:calc(100% - 20px)}
.hint:empty{display:none}
.toasts{position:absolute;right:8px;top:21%;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;max-width:62%}
.toast{background:rgba(15,26,30,.92);border:1px solid var(--line);padding:4px 10px;border-radius:6px;font-size:13px;animation:fade 3s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-4px)}8%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.keys{font-size:12px;color:var(--muted);margin-left:auto}
kbd{font-family:var(--f-body);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text)}
.btn{font-family:var(--f-display);font-size:15px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;cursor:pointer;line-height:1.2}
.btn:hover:not([disabled]){border-color:var(--lantern)}
.btn:focus-visible,.opt:focus-visible,.swc:focus-visible,.sp:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}
.btn[disabled]{opacity:.38;cursor:not-allowed}
.btn.primary{background:var(--lantern);color:#2b230c;border-color:var(--lantern)}
.btn.small{font-size:13px;padding:5px 10px}
.btn.on{border-color:var(--lantern);color:var(--lantern)}
.pad{display:none;justify-content:space-between;align-items:center;gap:16px;user-select:none;-webkit-user-select:none}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px}
.dpad button,.abtn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-family:var(--f-display);font-size:18px;touch-action:none}
.abtn{width:84px;height:84px;border-radius:50%;background:var(--lantern);color:#2b230c;border-color:var(--lantern);font-size:20px}
@media (pointer:coarse){.pad{display:flex}.keys{display:none}}
.modal{position:fixed;inset:0;background:rgba(6,12,14,.66);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.card.wide{max-width:760px}
.card h2{font-family:var(--f-display);font-weight:normal;font-size:23px;margin:0;color:var(--lantern);text-wrap:balance}
.card p{margin:0;line-height:1.6}
.sub{color:var(--muted);font-size:13px}
.say{background:var(--panel2);border-radius:8px;padding:10px 12px;line-height:1.65}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:8px;padding:8px 10px}
.row .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.nm{font-family:var(--f-display);font-size:15px}
.ds{font-size:12px;color:var(--muted);line-height:1.45}
.sw{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.ok{color:var(--moss)} .no{color:var(--rose)}
.cat{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.kv{display:flex;justify-content:space-between;gap:8px;background:var(--panel2);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted);font-size:13px}
.kv b{font-weight:normal;font-family:var(--f-display)}
.kv em{font-style:normal;color:var(--moss);font-size:12px;margin-left:4px}
input[type=text]{font-family:var(--f-display);font-size:16px;background:var(--night);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;box-sizing:border-box}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.prog{height:8px;border-radius:4px;background:var(--night);overflow:hidden}
.prog i{display:block;height:100%;background:var(--lantern)}
/* 캐릭터/펫 만들기 */
.maker{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:560px){.maker{grid-template-columns:minmax(0,1fr)}}
.preview{background:linear-gradient(#9fd0e0,#cfe8c0 62%,#7db35a 62%);border-radius:10px;width:100%;height:auto;aspect-ratio:1/1;display:block}
.opts{display:flex;flex-direction:column;gap:10px;min-width:0}
.optrow{display:flex;flex-direction:column;gap:5px}
.optrow > span{font-size:12px;color:var(--muted);letter-spacing:.06em}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.opt{font-family:var(--f-body);font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--lantern);color:var(--lantern)}
.swc{width:26px;height:26px;border-radius:50%;border:2px solid var(--panel2);cursor:pointer;padding:0;box-shadow:0 0 0 1px var(--line)}
.swc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--lantern)}
.species{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.sp{background:var(--panel2);border:2px solid transparent;border-radius:8px;padding:4px;cursor:pointer;color:var(--text);font-family:var(--f-display);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
.sp canvas{width:100%;height:auto;aspect-ratio:3/2}
.sp[aria-pressed="true"]{border-color:var(--lantern)}
.sp small{font-family:var(--f-body);font-size:10px;color:var(--muted)}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
/* 전투 */
#bcv{width:100%;height:auto;aspect-ratio:480/200;border-radius:8px;display:block}
.bbars{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-variant-numeric:tabular-nums}
.bbar{display:flex;flex-direction:column;gap:4px;font-size:13px;min-width:0}
.bbar .meter{width:100%;height:10px}
.blog{background:var(--night);border-radius:8px;padding:8px 10px;font-size:13px;line-height:1.6;height:96px;overflow:auto}
.blog div:last-child{color:var(--lantern)}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<div class="game">
  <div class="hud">
    <div class="brand">달맞이 들판<small>펫과 함께 사는 들판 생활</small></div>

    </div>
    <button class="abtn" id="aBtn">A</button>
  </div>
</div>
<div class="modal" id="modal" hidden></div>
<div class="modal" id="battle" hidden>
  <div class="card">
    <h2 id="bTitle">전투</h2>
    <canvas id="bcv" width="960" height="400"></canvas>
    <div class="bbars">
      <div class="bbar"><span id="bPetT"></span><span class="meter hp"><i id="bPetHp"></i></span></div>
      <div class="bbar"><span id="bMonT"></span><span class="meter hp"><i id="bMonHp"></i></span></div>
    </div>
    <div class="chips" id="bChips"></div>
    <div class="blog" id="blog"></div>
    <div class="actions" id="bacts"></div>
  </div>
</div>

  hair:{label:'머리색',type:'color',opts:['#2b2420','#5a3a2a','#a0703f','#e6c26a','#d9573b','#f4a6c8','#7cc7e8','#e9e4ff','#8fc46a','#9a5cc0']},
  eyeShape:{label:'눈 모양',type:'text',opts:[['round','동글눈'],['smile','반달눈'],['sharp','고양이눈'],['sleepy','졸린눈'],['sparkle','반짝눈']]},
  eye:{label:'눈동자색',type:'color',opts:['#2b2420','#6b4226','#3f6fb0','#3f8a52','#9a5cc0','#c74d4d','#d9a52a']},
  outfit:{label:'옷 색',type:'color',opts:['#5b8fc4','#c74d4d','#6fa064','#e6a84a','#9a5cc0','#f4a6c8','#3a3a40','#f2f0ea']},
  hat:{label:'머리 장식',type:'text',opts:[['straw','밀짚모자'],['none','없음'],['bandana','두건'],['flower','꽃핀'],['beret','베레모']]},
};
const DEFAULT_LOOK={g:'f',skin:'#f5d3b3',hairStyle:'pony',hair:'#5a3a2a',eyeShape:'round',eye:'#2b2420',outfit:'#5b8fc4',hat:'straw'};
const BARTENDER={g:'m',skin:'#e8b98f',hairStyle:'short',hair:'#3a3a40',eyeShape:'smile',eye:'#2b2420',outfit:'#8a5a32',hat:'bandana'};

/* ================= 상태 ================= */
let S=null, mons=[];
const ui={modal:null,battle:false,mv:null,pmv:null,held:[],safeUntil:0,lastWander:0,plot:null,bagTab:'전체',
  look:{...DEFAULT_LOOK},pName:'',sp:'fox',spCol:0,grp:'전체',petName:'',lastBlock:'',autoBattle:false};
const SAVE_KEY='dalmaji-save-v2';
function newState(){
  const sp=ui.sp,r=ROLES[PETS[sp].role];
  return {day:1,energy:100,gold:50,wins:0,map:'field',px:4,py:3,dir:'down',petX:5,petY:3,
    name:ui.pName.trim()||'여행자',look:{...ui.look},
    inv:{wheat_seed:4,berry:2},
    pet:{type:sp,col:ui.spCol,name:ui.petName.trim()||PETS[sp].n,lv:1,exp:0,hp:r.hp,aff:10,petted:false,meal:null,equip:{head:null,ear:null,neck:null,ring:null,body:null}},
    nodes:{field:{},forest:{},cave:{}},plots:{},quest:{idx:0,prog:0},bossesDown:{}};
}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const s=JSON.parse(localStorage.getItem(SAVE_KEY));return s&&s.pet&&s.inv&&PETS[s.pet.type]?s:null}catch(e){return null}}

const has=(id,n=1)=>(S.inv[id]||0)>=n;
function give(id,n){S.inv[id]=(S.inv[id]||0)+n}
function take(id,n){S.inv[id]=(S.inv[id]||0)-n;if(S.inv[id]<=0)delete S.inv[id]}
const canMake=need=>Object.entries(need).every(([k,v])=>has(k,v));

function petStats(){
  const p=S.pet,b=ROLES[PETS[p.type].role],L=p.lv-1;
  const s={hp:b.hp+b.g.hp*L,atk:b.atk+b.g.atk*L,def:b.def+b.g.def*L,spd:b.spd+b.g.spd*L,crit:b.crit};
  for(const sl in p.equip){const id=p.equip[sl];if(id)for(const [k,v] of Object.entries(EQUIPS[id].st))s[k]+=v}
  if(p.meal)for(const [k,v] of Object.entries(p.meal.st))s[k]+=v;
  const m=1+p.aff/500;
  s.hp=Math.round(s.hp*m);s.atk=Math.round(s.atk*m);s.def=Math.round(s.def*m);s.spd=Math.round(s.spd);
  return s;
}
const needExp=lv=>15+lv*15;

/* 몬스터: 맵 범위 안에서 레벨을 정하고, 펫과 같은 레벨이 최소 3마리는 있도록 맞춘다 */
function spawnMons(){
  mons=[];
  for(const m in SPAWNS)for(const [type,x,y] of SPAWNS[m]){
    if(MONS[type].boss&&S.bossesDown[type])continue;
    const lv=MONS[type].boss?MONS[type].lv:rnd(...LVR[m]);
    mons.push({type,map:m,x,y,hx:x,hy:y,lv,alive:true,mv:null,ph:Math.random()*6});
  }
  ensureMatches();
}
function ensureMatches(){
  const L=S.pet.lv;
  for(const m in LVR){
    const [a,b]=LVR[m];if(L<a||L>b)continue;
    const pool=mons.filter(e=>e.map===m&&e.alive&&!MONS[e.type].boss);
    let have=pool.filter(e=>e.lv===L).length;
    for(const e of pool.sort(()=>Math.random()-.5)){if(have>=3)break;if(e.lv!==L){e.lv=L;have++}}
  }
}
const bossLv=type=>Math.max(MONS[type].lv,S.pet.lv);
const monLv=e=>MONS[e.type].boss?bossLv(e.type):e.lv;
const canFight=e=>MONS[e.type].boss?(S.pet.lv>=MONS[e.type].lv&&S.quest.idx>=(BOSS_QREQ[e.type]||0)):e.lv===S.pet.lv;

/* ================= 맵 규칙 ================= */
const tile=(m,x,y)=>(x<0||y<0||x>=MW||y>=MH)?(MAPS[m].safe?'w':'W'):MAPS[m].rows[y][x];
const depleted=(m,x,y)=>!!(S.nodes[m]&&S.nodes[m][key(x,y)]);
function solid(m,x,y){
  const ch=tile(m,x,y);
  if('W#HCKPSMTRXYwcntb'.includes(ch))return true;
  if(ch==='V')return !gateOpen(m);
  if(NODES[ch])return !depleted(m,x,y);
  return false;
}
const monAt=(m,x,y)=>mons.find(e=>e.alive&&e.map===m&&e.x===x&&e.y===y);
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
function facing(){const [dx,dy]=DIRS[S.dir];return [S.px+dx,S.py+dy]}

/* ================= 이동 ================= */
function tryMove(dir){
  S.dir=dir;
  const [dx,dy]=DIRS[dir],nx=S.px+dx,ny=S.py+dy;
  const mo=monAt(S.map,nx,ny);
  if(mo){bump(mo);return}
  if(solid(S.map,nx,ny)){updateHint();return}
  const now=performance.now();
  ui.mv={fx:S.px,fy:S.py,t0:now};ui.pmv={fx:S.petX,fy:S.petY,t0:now};
  S.petX=S.px;S.petY=S.py;S.px=nx;S.py=ny;
}
function bump(mo){
  if(canFight(mo))return startBattle(mo);
  const k=mo.x+','+mo.y+S.pet.lv+S.quest.idx;
  if(ui.lastBlock!==k){ui.lastBlock=k;
    if(MONS[mo.type].boss){
      const need=MONS[mo.type].lv,qreq=BOSS_QREQ[mo.type]||0;
      if(S.pet.lv<need)toast(MONS[mo.type].n+'이(가) '+josa(S.pet.name,'을','를')+' 내려다본다. Lv.'+need+' 이상이 되어야 도전할 수 있다.');
      else toast(MONS[mo.type].n+'이(가) 아직 마음을 열지 않았다. 석상의 시험을 '+qreq+'번째까지 마쳐야 도전할 수 있다.');
    }
    else toast(MONS[mo.type].n+' Lv.'+mo.lv+' · '+josa(S.pet.name,'과','와')+' 레벨이 달라 싸울 수 없다. 같은 레벨끼리만 싸울 수 있다.');}
}
function arrive(){
  const tr=TRANS[S.map]&&TRANS[S.map][tile(S.map,S.px,S.py)];
  if(tr)changeMap(...tr);
  updateHint();
}
function changeMap(m,x,y,dir,px,py){
  S.map=m;S.px=x;S.py=y;S.dir=dir;S.petX=px;S.petY=py;ui.mv=ui.pmv=null;parts=[];
  $('#place').textContent=MAPS[m].name;
  showZone(m);
  ui.safeUntil=performance.now()+1500;
  save();
}
function wander(now){
  if(MAPS[S.map].safe||now-ui.lastWander<850)return;
  ui.lastWander=now;
  for(const e of mons){
    if(!e.alive||e.map!==S.map||MONS[e.type].boss||e.mv)continue;
    if(Math.random()<.45)continue;
    const d=['up','down','left','right'][rnd(0,3)],[dx,dy]=DIRS[d],nx=e.x+dx,ny=e.y+dy;
    if(Math.abs(nx-e.hx)>3||Math.abs(ny-e.hy)>3)continue;
    if(nx===S.px&&ny===S.py){if(canFight(e)&&now>ui.safeUntil&&!ui.modal&&!ui.mv){startBattle(e);return}continue}
    const ch=tile(S.map,nx,ny);
    if(solid(S.map,nx,ny)||'o<>V'.includes(ch)||monAt(S.map,nx,ny)||(nx===S.petX&&ny===S.petY))continue;
    e.mv={fx:e.x,fy:e.y,t0:now};e.x=nx;e.y=ny;
  }
}

/* ================= 상호작용 ================= */
function describeFacing(){
  const [x,y]=facing(),m=S.map,ch=tile(m,x,y);
  const mo=monAt(m,x,y);
  if(mo){
    if(canFight(mo))return MONS[mo.type].n+' Lv.'+monLv(mo)+' · 전투';
    if(MONS[mo.type].boss)return MONS[mo.type].n+' Lv.'+monLv(mo)+(S.pet.lv<MONS[mo.type].lv?' · Lv.'+MONS[mo.type].lv+' 이상 필요':' · 석상의 시험을 더 마쳐야 함');
    return MONS[mo.type].n+' Lv.'+monLv(mo)+' · 레벨이 달라 싸울 수 없음';
  }
  if(ch==='H')return '여관 · 달맞이 주막 들어가기';
  if(ch==='C')return '작업대 · 장신구 만들기';
  if(ch==='K')return '요리솥 · 요리하기';
  if(ch==='P')return '떠돌이 상인 루루의 가게';
  if(ch==='S')return m==='forest'?'신비로운 오래된 큰 나무':m==='cave'?'신비로운 오래된 석탑':'신비로운 석상';
  if(ch==='c'||ch==='n')return '주막 주인 보리 · 음식 사기';
  if(ch==='b')return '침대 · 쉬기';
  if(ch==='t')return '나무 탁자. 누군가 두고 간 컵이 있다.';
  if(ch==='V'&&!gateOpen(m))return '빛나는 덩굴 · '+josa(MONS[GATES[m].boss].n,'을','를')+' 물리쳐야 열린다';
  if(ch==='#')return '맑은 시냇물';
  if(NODES[ch]&&!depleted(m,x,y))return NODES[ch].verb+' (기력 '+NODES[ch].cost+')';
  if(ch==='o'){
    const p=S.plots[key(x,y)];
    if(!p)return '빈 밭 · 씨앗 심기';
    const c=CROPS[p.seed];
    if(p.days>=c.days)return ITEMS[c.crop].n+' 수확하기';
    return ITEMS[c.crop].n+' '+p.days+'/'+c.days+'일'+(p.watered?' · 물 줌':' · 물 주기');
  }
  return '';
}
function updateHint(){if(!S)return;const d=describeFacing();$('#hint').textContent=d?'Space · '+d:''}
function interact(){
  if(ui.modal||ui.battle||ui.mv)return;
  const [x,y]=facing(),m=S.map,ch=tile(m,x,y);
  const mo=monAt(m,x,y);
  if(mo){ui.lastBlock='';return bump(mo)}
  if(ch==='H')return changeMap('inn',8,10,'up',9,10);
  if(ch==='C')return openPanel('craft');
  if(ch==='K')return openPanel('cook');
  if(ch==='P')return openPanel('shop');
  if(ch==='S')return openPanel('statue');
  if(ch==='c'||ch==='n')return openPanel('tavern');
  if(ch==='b')return openPanel('bed');
  if(ch==='V'&&!gateOpen(m))return toast('덩굴이 석상과 같은 빛으로 일렁인다. '+josa(MONS[GATES[m].boss].n,'을','를')+' 찾아 물리쳐야 길이 열린다. (Lv.'+MONS[GATES[m].boss].lv+' 이상)');
  if(ch==='#')return toast('졸졸 흐르는 시냇물. '+josa(S.pet.name,'이','가')+' 신나서 물장구를 친다.');
  if(NODES[ch]&&!depleted(m,x,y))return gather(m,x,y,ch);
  if(ch==='o')return plotAction(x,y);
}
function useEnergy(n){if(S.energy<n){toast('너무 지쳤다. 여관 2층에서 쉬자.');return false}S.energy-=n;return true}
function gather(m,x,y,ch){
  const nd=NODES[ch];if(!useEnergy(nd.cost))return;
  const a=rnd(...nd.amt);give(nd.item,a);
  let msg=ITEMS[nd.item].n+' +'+a;
  if(nd.extra&&Math.random()<nd.extra[1]){give(nd.extra[0],1);msg+=' · '+ITEMS[nd.extra[0]].n+' +1'}
  (S.nodes[m]=S.nodes[m]||{})[key(x,y)]=1;
  toast(msg);wfx(x,y,msg);refreshHud();updateHint();save();
}
function plotAction(x,y){
  const k=key(x,y),p=S.plots[k];
  if(!p){
    if(!Object.keys(S.inv).some(id=>CROPS[id]))return toast('씨앗이 없다. 아래쪽 루루의 가게에서 살 수 있다.');
    ui.plot=k;return openPanel('seeds');
  }
  const c=CROPS[p.seed];
  if(p.days>=c.days){
    const a=rnd(...c.y);give(c.crop,a);delete S.plots[k];
    let msg=ITEMS[c.crop].n+' +'+a;
    if(Math.random()<.3){give(p.seed,1);msg+=' · '+ITEMS[p.seed].n+' +1'}
    toast(msg);wfx(x,y,msg,'#a8f07a');
  }else if(!p.watered){if(!useEnergy(2))return;p.watered=true;toast('물을 듬뿍 줬다. 자고 나면 자란다.')}
  else if(has('fertilizer')){take('fertilizer',1);p.days++;toast('비료를 줬다. 쑥 자랐다!')}
  else toast('오늘은 물을 줬다. 내일을 기다리자.');
  refreshHud();updateHint();save();
}
function sleepDay(){
  S.day++;S.energy=100;
  S.pet.hp=petStats().hp;S.pet.petted=false;
  S.nodes={field:{},forest:{},cave:{}};
  let grown=0;
  for(const k in S.plots){const p=S.plots[k];if(p.watered){p.days++;grown++}p.watered=false}
  spawnMons();closeModal();
  toast(S.day+'일차 아침. 여관 창밖으로 들판이 새로 자랐다.');
  if(grown)toast('물 준 작물 '+grown+'칸이 자랐다.');
  refreshHud();updateHint();save();
}

/* ================= 패널 ================= */
const modal=$('#modal');
function closeModal(){modal.hidden=true;modal.innerHTML='';ui.modal=null;updateHint()}
function openPanel(name){ui.modal=name;modal.hidden=false;renderPanel()}
const sw=id=>`<span class="sw" style="background:${ITEMS[id].c}"></span>`;
const needHtml=need=>Object.entries(need).map(([k,v])=>{const h=S.inv[k]||0;return `<span class="${h>=v?'ok':'no'}">${ITEMS[k].n} ${h}/${v}</span>`}).join(' · ');
const closeBtn='<div class="actions"><button class="btn" data-act="close">닫기</button></div>';
function buyList(list){return '<div class="list">'+list.map(s=>{const it=ITEMS[s.id];return `<div class="row">${sw(s.id)}<div class="info"><span class="nm">${it.n}${has(s.id)?` <span class="sub">보유 ${S.inv[s.id]}</span>`:''}</span><span class="ds">${it.d}</span></div><button class="btn small" data-act="buy" data-id="${s.id}" data-p="${s.p}" ${S.gold>=s.p?'':'disabled'}>${s.p}G</button></div>`}).join('')+'</div>'}
function renderPanel(){
  const n=ui.modal;let h='',wide=false;
  if(n==='seeds'){
    h=`<h2>무엇을 심을까</h2><div class="list">`+Object.keys(S.inv).filter(id=>CROPS[id]).map(id=>`<div class="row">${sw(id)}<div class="info"><span class="nm">${ITEMS[id].n} ×${S.inv[id]}</span><span class="ds">${ITEMS[id].d}</span></div><button class="btn small" data-act="plant" data-id="${id}">심기</button></div>`).join('')+`</div>`+closeBtn;
  }else if(n==='craft'){
    h=`<h2>작업대</h2><p class="sub">채집한 재료로 펫의 장신구와 의상을 만듭니다. 만든 뒤 가방이나 펫 창에서 장착하세요.</p>`;
    for(const sl in SLOTS){
      h+=`<div class="cat">${SLOTS[sl]}</div><div class="list">`;
      for(const id in EQUIPS){const e=EQUIPS[id];if(e.slot!==sl)continue;
        h+=`<div class="row">${sw(id)}<div class="info"><span class="nm">${e.n}${has(id)?` <span class="sub">보유 ${S.inv[id]}</span>`:''}</span><span class="ds">${statText(e.st)}</span><span class="ds">${needHtml(e.need)}</span></div><button class="btn small" data-act="craft" data-id="${id}" ${canMake(e.need)?'':'disabled'}>만들기</button></div>`}
      h+='</div>';
    }
    h+=closeBtn;
  }else if(n==='cook'){
    h=`<h2>요리솥</h2><p class="sub">밖에서 먹이면 능력 보너스가 다음 전투 3번 동안 이어지고, 전투 중에 먹이면 그 전투에만 적용됩니다.</p><div class="list">`;
    for(const r of COOKS){const it=ITEMS[r.out];
      h+=`<div class="row">${sw(r.out)}<div class="info"><span class="nm">${it.n}${has(r.out)?` <span class="sub">보유 ${S.inv[r.out]}</span>`:''}</span><span class="ds">${it.d}</span><span class="ds">${needHtml(r.need)}</span></div><button class="btn small" data-act="cook" data-id="${r.out}" ${canMake(r.need)?'':'disabled'}>요리하기</button></div>`}
    h+='</div>'+closeBtn;
  }else if(n==='shop'){
    h=`<h2>떠돌이 상인 루루</h2><div class="say">"어서 와! 우리 가게는 골드로 사는 것만 돼. 물건은 안 받아. 골드는 전투랑 석상의 시험으로 모으렴."</div><p class="sub">보유 골드 <b class="ok">${S.gold}G</b></p>`+buyList(SHOP)+closeBtn;
  }else if(n==='tavern'){
    const rumor=!gateOpen('field')?`동쪽 덩굴 말이야, 가시덩굴 수호자가 지키고 있다더군. 석상의 시험을 ${GATES.field.qreq}번째까지 마치면 그제야 말을 들어준다던데. 장신구 잘 맞춰 입고 든든히 먹이고 가면 이길 만하다던데.`
      :!gateOpen('forest')?`버섯숲 동쪽 끝엔 여왕이 있다지. 시험을 ${GATES.forest.qreq}번째까지 마치고 Lv.8은 돼야 상대가 된다더군. 숲 재료로 장비를 단단히 갖추고 가게.`
      :'수정동굴의 도깨비불은 달빛을 먹고 산대. 거기 월광석으로 만든 장신구는 대단하다더군.';
    h=`<h2>주막 주인 보리</h2><div class="say">"어서 오게, ${esc(S.name)}. 여기선 싸움 금지야. 배부르게 먹고, 쉬고 싶으면 2층 침실로 올라가게."</div>
      <div class="say"><span class="sub">주막의 소문</span><br>"${rumor}"</div><p class="sub">보유 골드 <b class="ok">${S.gold}G</b></p>`+buyList(TAVERN)+closeBtn;
  }else if(n==='bed'){
    h=`<h2>2층 침실</h2><p>푹신한 이불에서 ${josa(S.pet.name,'이','가')} 먼저 몸을 말고 눕는다.</p>

function questProg(q){
  if(q.type==='give')return [Math.min(S.inv[q.item]||0,q.n),q.n];
  if(q.type==='kill')return [Math.min(S.quest.prog,q.n),q.n];
  return [Object.values(S.pet.equip).some(Boolean)?1:0,1];
}
function completeQuest(){
  const q=QUESTS[S.quest.idx];if(!q)return;
  const [c,m]=questProg(q);if(c<m)return;
  if(q.type==='give')take(q.item,q.n);
  S.gold+=q.rw.gold;
  if(q.rw.items)for(const [k,v] of Object.entries(q.rw.items))give(k,v);
  S.quest.idx++;S.quest.prog=0;
  toast('시험 통과! '+q.rw.gold+'G');
  refreshHud();save();
  if(q.final){
    modal.innerHTML=`<div class="card"><h2>달이 뜬 들판</h2><div class="say">석상의 달이 환하게 차오른다. "${esc(S.name)}여, 너는 한 번도 직접 싸우지 않았다. 그러나 밭을 일구고, 꽃을 엮고, 따뜻한 것을 끓여 ${josa(S.pet.name,'을','를')} 지켰다. 그것이 이 들판의 힘이다."</div><p class="sub">${S.day}일 만에 모든 시험을 통과했습니다. 달빛 수정동굴은 계속 열려 있어요.</p><div class="actions"><button class="btn primary" data-act="close">계속 지내기</button></div></div>`;
    return;
  }
  renderPanel();
}

function makeHtml(){
  let o='';
  for(const [k,def] of Object.entries(LOOK_OPTS)){
    o+=`<div class="optrow"><span>${def.label}</span><div class="chips">`;
    if(def.type==='color')o+=def.opts.map(c=>`<button class="swc" style="background:${c}" data-act="look" data-k="${k}" data-v="${c}" aria-pressed="${ui.look[k]===c}" aria-label="${def.label} ${c}"></button>`).join('');
    else o+=def.opts.map(([v,l])=>`<button class="opt" data-act="look" data-k="${k}" data-v="${v}" aria-pressed="${ui.look[k]===v}">${l}</button>`).join('');
    o+='</div></div>';
  }
  return `<h2>나를 만들기</h2><p class="sub">들판에서 지낼 당신의 모습을 고르세요.</p>
  <div class="maker"><div class="opts"><canvas class="preview" id="mkPrev" width="440" height="440"></canvas>
  <button class="btn small" data-act="randLook">무작위로</button></div>
  <div class="opts"><div class="optrow"><span>이름</span><input type="text" id="pName" maxlength="8" placeholder="여행자" value="${esc(ui.pName)}"></div>${o}</div></div>
  <div class="actions">${S?'<button class="btn" data-act="cancelNew">취소</button>':''}<button class="btn primary" data-act="toPick">다음 · 펫 고르기</button></div>`;
}

function dmgCalc(atk,def,crit){
  let d=Math.max(1,Math.round(atk*(.85+Math.random()*.3)-def*.6));
  const c=Math.random()*100<crit;if(c)d=Math.round(d*1.6);
  return [d,c];
}
async function round(act,foodId){
  if(B.busy||B.over)return;
  B.busy=true;B.turn++;renderBattle();
  const nm=S.pet.name;let guard=false;
  if(act==='cheer'){B.cheer=3;B.cheerCd=4;bLog(`"힘내, ${nm}!" 응원을 받아 공격력이 오른다.`)}
  else if(act==='guard'){guard=true;bLog(`"조심해!" ${josa(nm,'이','가')} 몸을 낮춰 방어 자세를 잡는다.`)}
  else if(act==='feed'){
    const f=ITEMS[foodId].food;take(foodId,1);
    if(f.buff)for(const [k,v] of Object.entries(f.buff))B.buff[k]+=v;
    const before=S.pet.hp;S.pet.hp=Math.min(bStats().hp,before+f.heal);
    if(f.aff)S.pet.aff=Math.min(100,S.pet.aff+f.aff);
    bLog(`${ITEMS[foodId].n}을(를) 던져 줬다! 체력 +${S.pet.hp-before}${f.buff?' · '+statText(f.buff):''}`);
    B.fx.push({side:'pet',txt:'+'+(S.pet.hp-before),col:'#8fc46a',t0:performance.now()});
  }
  else if(act==='flee'){
    if(bStats().spd>B.mon.spd||Math.random()<.6){bLog(`${josa(nm,'을','를')} 안고 재빨리 도망쳤다.`);B.over='flee';B.busy=false;renderBattle();return}
    bLog('도망치지 못했다!');
  }
  else bLog(`${josa(nm,'을','를')} 믿고 지켜본다.`);
  renderBattle();await sleep(420);
  const ps=bStats();
  const order=ps.spd>=B.mon.spd?['pet','mon']:['mon','pet'];
  for(const who of order){
    if(B.over)break;
    if(who==='pet'){
      if(act==='flee')continue;
      const [d,c]=dmgCalc(ps.atk*(B.cheer?1.4:1),B.mon.def,ps.crit);
      B.lunge.pet=performance.now();await sleep(160);
      B.mon.hp-=d;B.shake.mon=performance.now();
      B.fx.push({side:'mon',txt:(c?'치명! ':'')+d,col:c?'#f2c14e':'#ffffff',t0:performance.now()});
      bLog(`${nm}의 공격! ${B.mon.n}에게 ${d}${c?' (치명타!)':''}`);
      if(B.mon.hp<=0){B.mon.hp=0;renderBattle();await sleep(300);win();break}
    }else{
      const special=B.mon.boss&&B.turn%3===0;
      let [d]=dmgCalc(B.mon.atk*(special?1.5:1),ps.def,4);
      if(guard)d=Math.max(1,Math.round(d*.45));
      B.lunge.mon=performance.now();await sleep(160);
      S.pet.hp-=d;B.shake.pet=performance.now();
      B.fx.push({side:'pet',txt:'-'+d,col:'#ec8b8b',t0:performance.now()});
      bLog(special?`${B.mon.n}의 포자 폭풍! ${josa(nm,'이','가')} ${d} 피해를 입었다.`:`${B.mon.n}의 공격. ${josa(nm,'이','가')} ${d} 피해${guard?' (막아냈다)':''}.`);
      if(S.pet.hp<=0){S.pet.hp=0;renderBattle();await sleep(300);lose();break}
    }
    renderBattle();await sleep(380);
  }
  if(B.cheer)B.cheer--;if(B.cheerCd)B.cheerCd--;
  B.busy=false;renderBattle();
}
function win(){
  const m=B.mon,p=S.pet;
  B.over='win';B.ent.alive=false;
  if(m.boss)S.bossesDown[B.type]=true;
  S.wins++;S.gold+=m.gold;p.aff=Math.min(100,p.aff+1);
  if(p.lv<MAXLV)p.exp+=m.exp;
  bLog(`${m.n}을(를) 물리쳤다! 경험치 +${m.exp} · ${m.gold}G · 누적 승리 ${S.wins}`);
  const got=[];
  for(const [id,ch,a,b] of m.drops)if(Math.random()<ch){const n=rnd(a,b);give(id,n);got.push(ITEMS[id].n+' '+n)}
  if(got.length)bLog('얻은 것: '+got.join(', '));
  let up=false;
  while(p.lv<MAXLV&&p.exp>=needExp(p.lv)){p.exp-=needExp(p.lv);p.lv++;up=true;p.hp=petStats().hp;bLog(`${josa(p.name,'이','가')} Lv.${p.lv}로 성장했다! 이제 Lv.${p.lv} 상대와 싸울 수 있다.`)}
  if(p.lv>=MAXLV)p.exp=0;
  if(up)ensureMatches();
  if(m.boss){const gi=Object.entries(GATES).find(([mp,g])=>g.boss===B.type);if(gi)bLog(`어딘가에서 덩굴이 시드는 소리가 났다. ${gi[1].to}(으)로 가는 길이 열렸다!`)}
  const q=QUESTS[S.quest.idx];
  if(q&&q.type==='kill'&&q.mon===B.type){S.quest.prog++;bLog(`석상의 시험 ${Math.min(S.quest.prog,q.n)}/${q.n}`)}
  afterBattleMeal();renderBattle();save();
}
function lose(){
  B.over='lose';

}

}

  ctx.font='38px Jua, sans-serif';ctx.lineWidth=6;ctx.strokeStyle='rgba(8,14,18,.75)';ctx.strokeText(ui.zone.name,VW/2,150);ctx.fillStyle='#f6e7b4';ctx.fillText(ui.zone.name,VW/2,150);
  const w=ctx.measureText(ui.zone.name).width/2+30;ctx.strokeStyle='#f2c14e';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(VW/2-w-90,140);ctx.lineTo(VW/2-w,140);ctx.moveTo(VW/2+w,140);ctx.lineTo(VW/2+w+90,140);ctx.stroke();
  ctx.font='15px "Gowun Dodum", sans-serif';ctx.lineWidth=4;ctx.strokeText(ui.zone.sub,VW/2,178);ctx.fillStyle='#e8eadf';ctx.fillText(ui.zone.sub,VW/2,178);ctx.restore();
}
function zoneSub(m){if(MAPS[m].safe)return '안전 지대 · 전투 없음';const [a,b]=LVR[m];return '몬스터 Lv.'+a+'~'+b}
function showZone(m){ui.zone={name:MAPS[m].name,sub:zoneSub(m),t0:performance.now()}}
const MINI={W:'#1f3a1c',w:'#1a0e08','#':'#3a86b8',H:'#c99a62',S:'#f2c14e',P:'#c74d4d',C:'#a0703f',K:'#a0703f',o:'#7a5536',c:'#5a3920',b:'#9a5cc0',t:'#7a5030',M:'#a0548f'};
function drawMinimap(m,now){
  const W0=VW-178,H0=12,w=158,h=96,tw=w/MW,th=h/MH;
  rr(ctx,W0,H0,w,h,8,'rgba(10,18,22,.72)');ctx.strokeStyle='rgba(242,193,78,.45)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(W0,H0,w,h,8);ctx.stroke();
  const G=GP[m];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const ch=tile(m,x,y);let col=MINI[ch]||(MAPS[m].safe?'#8f6140':G.g[0]);
    if('=<>'.includes(ch))col=MAPS[m].safe?'#8f6140':G.path[0];if(ch==='V')col=gateOpen(m)?G.path[0]:'#4f9a5a';if('TRXY'.includes(ch))col=m==='cave'?'#4a4f78':'#3d7032';
    if(MAPS[m].safe&&ch==='w'&&!(floorAt(m,x+1,y)||floorAt(m,x,y+1)||floorAt(m,x-1,y)||floorAt(m,x,y-1)))continue;
    ctx.fillStyle=col;ctx.fillRect(W0+x*tw,H0+y*th,tw,th)}
  for(const e of mons){if(!e.alive||e.map!==m)continue;circ(ctx,W0+(e.x+.5)*tw,H0+(e.y+.5)*th,1.8,MONS[e.type].boss?'#ff6a6a':canFight(e)?'#a8f07a':'#9aa0a8')}
  circ(ctx,W0+(S.petX+.5)*tw,H0+(S.petY+.5)*th,2,'#f2c14e');
  const pulse=2.6+Math.sin(now/200)*.6;circ(ctx,W0+(S.px+.5)*tw,H0+(S.py+.5)*th,pulse,'#ffffff');
}
function plate(txt,x,y,col,size=12){ctx.font=size+'px Jua, sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.strokeStyle='rgba(10,16,20,.85)';ctx.strokeText(txt,x,y);ctx.fillStyle=col;ctx.fillText(txt,x,y)}
function wfx(x,y,txt,col='#fff6c8'){(ui.wfx=ui.wfx||[]).push({x,y,txt,col,t0:performance.now()})}

function draw(now){
  ctx.setTransform(2,0,0,2,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  if(!S){const g=ctx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'#1d2b4a');g.addColorStop(.7,'#3a4a6a');g.addColorStop(.7,'#2f5a4b');g.addColorStop(1,'#24473c');ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);circ(ctx,760,110,40,'#f2e7a8');circ(ctx,776,100,36,'#1d2b4a');return}
  const m=S.map;
  const [px,py,pm]=entPos(S.px,S.py,ui.mv,now,MOVE_MS);
  const [qx,qy,qm]=entPos(S.petX,S.petY,ui.pmv,now,MOVE_MS);
  const psx=OX+px*T+16,psy=OY+py*T+16;
  ctx.fillStyle=GP[m].void;ctx.fillRect(0,0,VW,VH);
  lights=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)drawGround(m,x,y,now);
  if(!ui.modal&&!ui.battle&&describeFacing()){const [fx,fy]=facing(),sx=OX+fx*T,sy=OY+fy*T;ctx.save();ctx.globalAlpha=.55+Math.sin(now/250)*.25;ctx.strokeStyle='#f2c14e';ctx.lineWidth=2;ctx.setLineDash([5,4]);ctx.strokeRect(sx+2,sy+2,T-4,T-4);ctx.restore()}
  const list=[],plates=[];
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const ch=tile(m,x,y);if(!OBJ_CH.includes(ch))continue;list.push({d:y,f:()=>drawObjLocal(m,x,y,now)})}
  for(const e of mons){if(!e.alive||e.map!==m)continue;const [ex,ey]=entPos(e.x,e.y,e.mv,now,320),sx=OX+ex*T+16,sy=OY+ey*T+16,boss=MONS[e.type].boss,ok=canFight(e),s=boss?1.4:.95;
    list.push({d:ey+.01,f:()=>{ctx.save();if(!ok)ctx.globalAlpha=.65;drawMon(ctx,e.type,sx,sy-10*s+Math.sin(now/400+e.ph),s,now);ctx.restore()}});
    plates.push([MONS[e.type].n+' Lv.'+monLv(e)+(boss&&!ok?'+':''),sx,sy-(boss?62:34),boss?'#ff9a8a':ok?'#a8f07a':'#b8bcc0',11]);
    if(e.type==='wisp')light(sx,sy-14,70,'#c9d8ff',.8);if(boss)light(sx,sy-30,110,'#e07ad0',.8)}
  const qsx=OX+qx*T+16,qsy=OY+qy*T+16;
  list.push({d:qy+.01,f:()=>drawPet(ctx,S.pet.type,S.pet.col,qsx,qsy-12,1.4,petDir(),now,qm,S.pet.equip)});
  plates.push([S.pet.name+' Lv.'+S.pet.lv,qsx,qsy-38,'#f2c14e',11]);
  if(PETS[S.pet.type].glow)light(qsx,qsy-12,60,PETS[S.pet.type].glow,.7);
  list.push({d:py+.02,f:()=>drawPlayer(ctx,psx,psy-20,S.dir,now,pm,S.look,1.5)});
  plates.push([S.name,psx,psy-54,'#ffffff',13]);
  list.sort((a,b)=>a.d-b.d);for(const it of list)it.f();
  if(m==='field')drawClouds(now);
  updateParts(m,now);drawParts(now);
  drawLighting(m,now,psx,psy);
  for(const p of plates)plate(...p);
  if(ui.wfx){ui.wfx=ui.wfx.filter(f=>now-f.t0<1500);for(const f of ui.wfx){const k=(now-f.t0)/1500,sx=OX+f.x*T+16,sy=OY+f.y*T+16;ctx.save();ctx.globalAlpha=k<.7?1:(1-k)/.3;plate(f.txt,sx,sy-50-k*36,f.col,14);ctx.restore()}}
  drawVignette();
  drawMinimap(m,now);
  drawZone(now);
}

const bcv=$('#bcv'),bctx=bcv.getContext('2d');bctx.setTransform(2,0,0,2,0,0);
function drawBattle(now){
  const c=bctx;c.clearRect(0,0,480,200);
  const P={field:['#9fd0e0','#cfe8c0','#7db35a','#6aa04c'],forest:['#1e3a40','#2c5547','#2f5a4b','#24473c'],cave:['#141830','#2a2f4a','#2e3452','#232842']}[S.map]||['#9fd0e0','#cfe8c0','#7db35a','#6aa04c'];
  const g=c.createLinearGradient(0,0,0,200);g.addColorStop(0,P[0]);g.addColorStop(.62,P[1]);g.addColorStop(.63,P[2]);g.addColorStop(1,P[3]);
  c.fillStyle=g;c.fillRect(0,0,480,200);
  ell(c,130,160,70,14,'rgba(0,0,0,.15)');ell(c,350,160,70,14,'rgba(0,0,0,.15)');
  const off=(who,dir)=>{const t0=B.lunge[who];if(!t0)return 0;const k=(now-t0)/320;return k<1?Math.sin(k*Math.PI)*28*dir:0};
  const shk=who=>{const t0=B.shake[who];if(!t0)return 0;const k=(now-t0)/300;return k<1?Math.sin(k*40)*4*(1-k):0};
  c.save();if(S.pet.hp<=0)c.globalAlpha=.4;drawPet(c,S.pet.type,S.pet.col,130+off('pet',1)+shk('pet'),140,3.6,'right',now,false,S.pet.equip);c.restore();
  c.save();if(B.mon.hp<=0)c.globalAlpha=.3;drawMon(c,B.type,350+off('mon',-1)+shk('mon'),138,B.mon.boss?4:3.4,now);c.restore();
  drawPlayer(c,40,150,'right',now,false,S.look,2.2);
  if(B.cheer){c.font='14px Jua, sans-serif';c.textAlign='center';c.fillStyle='#f2c14e';c.fillText('응원 받는 중!',130,60+Math.sin(now/200)*3)}
  B.fx=B.fx.filter(f=>now-f.t0<900);
  for(const f of B.fx){const k=(now-f.t0)/900;c.save();c.globalAlpha=1-k;c.font='bold 20px Jua, sans-serif';c.textAlign='center';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.5)';const x=f.side==='pet'?130:350,y=80-k*30;c.strokeText(f.txt,x,y);c.fillStyle=f.col;c.fillText(f.txt,x,y);c.restore()}
}
function loop(now){
  if(S){
    if(ui.mv&&now-ui.mv.t0>=MOVE_MS){ui.mv=null;ui.pmv=null;arrive()}
    for(const e of mons)if(e.mv&&now-e.mv.t0>=320)e.mv=null;
    if(!ui.mv&&!ui.modal&&!ui.battle&&ui.held.length)tryMove(ui.held[ui.held.length-1]);
    if(!ui.modal&&!ui.battle)wander(now);
  }
  draw(now);
  if(ui.battle&&B)drawBattle(now);
  requestAnimationFrame(loop);
}

/* ================= 입력 ================= */
const KEYDIR={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const d=KEYDIR[e.code];
  if(d){if(!ui.modal&&!ui.battle)e.preventDefault();if(!ui.held.includes(d))ui.held.push(d);return}
  if(e.code==='Escape'){if(ui.modal&&S&&!['make','pick','start'].includes(ui.modal))closeModal();return}
  if(!S||ui.battle)return;
  if(e.code==='Space'||e.code==='KeyE'||e.code==='Enter'){if(!ui.modal){e.preventDefault();interact()}return}
  if(e.code==='KeyI')togglePanel('bag');
  if(e.code==='KeyP')togglePanel('pet');
  if(e.code==='KeyQ')togglePanel('quest');
});
addEventListener('keyup',e=>{const d=KEYDIR[e.code];if(d)ui.held=ui.held.filter(x=>x!==d)});
addEventListener('blur',()=>ui.held=[]);
function togglePanel(n){if(ui.battle||!S)return;if(ui.modal===n)closeModal();else if(!ui.modal||['bag','pet','quest','help'].includes(ui.modal))openPanel(n)}
$('#bBag').onclick=()=>togglePanel('bag');
$('#bPet').onclick=()=>togglePanel('pet');
$('#bQuest').onclick=()=>togglePanel('quest');
$('#bHelp').onclick=()=>togglePanel('help');
document.querySelectorAll('.dpad button').forEach(b=>{
  const d=b.dataset.dir;
  b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(!ui.held.includes(d))ui.held.push(d)});
  const up=()=>ui.held=ui.held.filter(x=>x!==d);
  b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);
});
$('#aBtn').addEventListener('click',()=>{if(S&&!ui.battle)interact()});

/* ================= 시작 ================= */
(function boot(){
  const saved=loadSave();
  if(saved){
    S=saved;S.wins=S.wins||0;S.bossesDown=S.bossesDown||(S.bossDown?{queen:true}:{});S.nodes=Object.assign({field:{},forest:{},cave:{}},S.nodes||{});S.look=S.look||{...DEFAULT_LOOK};
    spawnMons();$('#place').textContent=MAPS[S.map].name;refreshHud();updateHint();openPanel('start');
  }else openPanel('make');
  requestAnimationFrame(loop);
})();
